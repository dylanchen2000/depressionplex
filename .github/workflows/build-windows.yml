name: Build Windows Installer

# 手动触发 + 版本 tag 推送时自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60  # Windows 构建较慢,给足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PySide6==6.7.3 pyinstaller numpy==1.26.4

      - name: Fetch and verify ffmpeg (LGPL)
        run: python packaging/fetch_ffmpeg.py

      - name: Build GUI (PyInstaller)
        working-directory: packaging
        run: pyinstaller build_windows.spec

      - name: Build analyzer backend (PyInstaller)
        working-directory: packaging
        run: pyinstaller build_analyzer_windows.spec

      - name: Get version from pyproject.toml
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path pyproject.toml -Raw
          if ($content -match 'version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "Extracted version: $version"
          } else {
            echo "ERROR: Failed to extract version from pyproject.toml"
            exit 1
          }

      - name: Build installer (Inno Setup)
        working-directory: packaging
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=$version installer.iss

      - name: Smoke test - ffmpeg
        run: |
          vendor\ffmpeg\ffmpeg.exe -version
          vendor\ffmpeg\ffprobe.exe -version

      - name: Smoke test - backend exe
        run: |
          packaging\dist\depression-analyzer\depression-analyzer.exe --help

      - name: Smoke test - GUI exe (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          packaging\dist\DEPRESSION-PLEX\DEPRESSION-PLEX.exe --self-test

      - name: Record build environment
        run: |
          pip freeze > packaging/build_env.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEPRESSION-PLEX-Setup-${{ steps.get_version.outputs.VERSION }}
          path: |
            packaging/DEPRESSION-PLEX-Setup-${{ steps.get_version.outputs.VERSION }}.exe
            packaging/build_env.txt
          if-no-files-found: error
