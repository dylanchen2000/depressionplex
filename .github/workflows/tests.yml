name: Tests

# 只挂 push。**不要再加 pull_request**：本仓是单人私有仓、不用 fork，
# 而检查结果是挂在 commit SHA 上的，PR 页面照样能看到 ⇒ 加了 pull_request
# 只会让同一个 SHA 跑两遍，把 free plan 的 Actions 分钟数直接烧掉一半
# （2026-09-13 实测：同一次推送产生 4 个 run，两个 event=push、两个 event=pull_request，
#  结论完全相同）。
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    # 套件本地跑满约 3–4 分钟；给 20 分钟余量。封住「某个用例死循环挂到
    # runner 6 小时上限」这条——超时即失败，而不是安静地烧掉分钟数。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # openpyxl 的版本**必须与 pyproject 的 pin 一致**（守卫
        # test_ci_installs_the_pinned_desktop_deps 对账）：不装的后果不是「少测一点」，
        # 而是依赖它的守卫在 CI 上永远红，然后被人删掉（DP-110 第一轮就是这样）。
        # PySide6 刻意不装——套件必须能在没有 PySide6 的环境里跑完，外壳的运行期验证
        # 在 desktop-selftest.yml。
        run: pip install "numpy>=1.24" "openpyxl==3.1.5"
      - name: Run tests
        run: python3 run_tests.py
