[project]
name = "depressionplex"
version = "0.1.0.dev0"
description = "抑郁/绝望行为分析（FST 强迫游泳 + TST 悬尾）"
requires-python = ">=3.10"

# 核心 assay_core 只依赖 numpy——刻意不引入 OpenCV。
# 视频解码/分割等 I/O 层依赖放到 optional。
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
ml = ["scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depressionplex*"]
