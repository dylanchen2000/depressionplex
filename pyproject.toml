[project]
name = "depressionplex"
version = "0.1.0.dev0"
description = "抑郁/绝望行为分析（FST 强迫游泳 + TST 悬尾）"
requires-python = ">=3.10"

# 核心 assay_core 只依赖 numpy——刻意不引入 OpenCV。
# 视频解码/分割等 I/O 层依赖放到 optional。
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
ml = ["scikit-learn>=1.3"]

# 桌面外壳（desktop/）允许的第三方依赖。**这是唯一权威清单**（DP-114）：
#   - `tests/test_desktop_boundary.py::test_third_party_whitelist` 的白名单从这里读；
#   - 架构文件 §3.2 那张表是给人读的镜像，有守卫按这里对账；
#   - CI `tests.yml` 装哪些包也按这里对账（PySide6 除外，见下）。
# 版本必须**钉死**：客户打开的那个 .xlsx 是某个具体版本的 openpyxl 写出来的字节，
# 写成 `>=` 等于「客户拿到的文件由一个我们没测过的库产出」。
desktop = ["PySide6==6.7.3", "openpyxl==3.1.5"]

# 分发名 → import 名 + 允许出现的位置。
# **分发名不等于 import 名**（`opencv-python-headless` → `cv2`），所以映射必须显式写。
# `scope` 不是洁癖：xlsx 是客户拿走的文件，让 `import openpyxl` 散到七个页面里去，
# 「哪段代码在写客户手里的文件」这件事就再也说不清了。
[tool.depressionplex.desktop-imports]
PySide6 = { module = "PySide6", scope = "*" }
openpyxl = { module = "openpyxl", scope = "desktop/app/services/export_xlsx.py" }

# 构建期/引擎侧的钉子。**这是它们唯一的权威位置**（DP-114 的延伸，DP-108 A9）。
#
# 为什么不塞进上面的 `desktop` extra：那份清单回答的是「外壳允许 import 什么」，
# 而外壳不许 import 引擎（架构 §3.4），numpy 与 pyinstaller 都不是外壳的依赖。
#
# 为什么不塞进 `[project].dependencies`：那里的 `numpy>=1.24` 回答的是
# **「引擎能跑起来的下限」**，这里的 `numpy = "1.26.4"` 回答的是
# **「G7/G8 那批验收读数是在哪个 numpy 上得到的」**——两个不同的事实，
# 不许挤在同一行。2026-09-14 第一次真构建装进去的是 numpy 2.4.6（当时 workflow 写 `>=1.24`），
# 而 NEP 50 改了标量提升规则 ⇒ 秒数可能悄悄变（DP-115）。
#
# pyinstaller 决定客户手里那个 exe 的 bootloader。不钉它，等于同一个 tag
# 下个月重建会得到一个不同的二进制——而「可重建」是发布件的最低要求。
#
# 用它的地方（都有守卫对账，不许再抄第四份）：
#   - `.github/workflows/build-windows.yml` 的 `pip install`；
#   - `packaging/README.md` 里给人照着敲的那一行；
#   - 架构 §3.2 的镜像表。
[tool.depressionplex.build-pins]
numpy = "1.26.4"
pyinstaller = "6.22.3"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depressionplex*"]
